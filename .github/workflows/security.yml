name: Nightly security

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan Go modules
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  bun-audit:
    name: Bun audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked browser dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Audit Bun dependencies
        run: bun audit --audit-level high

  extended-fuzz:
    name: Extended fuzz
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzz hello decoding
        run: go test . -run '^$' -fuzz '^FuzzDecodeHello$' -fuzztime 5m
      - name: Fuzz resize decoding
        run: go test . -run '^$' -fuzz '^FuzzDecodeResize$' -fuzztime 5m

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan current tree and all history
        run: |
          set -Eeuo pipefail
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          "$GITLEAKS" dir --redact --exit-code 1 .
          "$GITLEAKS" git --log-opts='--all' --redact --exit-code 1 .
