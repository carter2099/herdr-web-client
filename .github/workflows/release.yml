name: Release
run-name: Release ${{ inputs.tag }} / ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Strict semantic release tag (vMAJOR.MINOR.PATCH[-suffix])'
        required: true
        type: string
      source_sha:
        description: 'Exact 40-character commit SHA currently at main'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: true
        type: boolean
        default: false
      request_id:
        description: 'Unique release request identifier'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REPOSITORY: carter2099/herdr-web-client
  GOTOOLCHAIN: local

jobs:
  validate:
    name: validate source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.inputs.outputs.release_version }}
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify source before release
        run: ./scripts/verify
      - name: Validate tag, source, and request identity
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*)|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          request_re='^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          [[ "$TAG" =~ $semver_re ]] || { echo "invalid release tag: $TAG" >&2; exit 1; }
          git check-ref-format "refs/tags/$TAG" >/dev/null || {
            echo "release tag is not a valid Git ref: $TAG" >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a lowercase full commit SHA' >&2; exit 1; }
          [[ "$PRERELEASE" == true || "$PRERELEASE" == false ]] || { echo 'prerelease must be true or false' >&2; exit 1; }
          [[ "$REQUEST_ID" =~ $request_re ]] || { echo "invalid request_id: $REQUEST_ID" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'checkout did not resolve source_sha' >&2; exit 1; }

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$SOURCE_SHA" ]] || {
            echo "main moved during release dispatch (expected $SOURCE_SHA, found $main_sha)" >&2
            exit 1
          }
          ci_conclusion="$(gh api \
            "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.run_number) | last | .conclusion // ""')"
          [[ "$ci_conclusion" == success ]] || {
            echo "latest completed main CI run for $SOURCE_SHA is not successful" >&2
            exit 1
          }

          resolve_tag_commit() {
            local object_type object_sha tag_object depth=0
            object_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
            object_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            while [[ "$object_type" == tag ]]; do
              ((depth += 1))
              ((depth <= 8)) || {
                echo "tag $TAG has an excessive annotated-tag chain" >&2
                return 1
              }
              tag_object="$(gh api "repos/$REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -er '.object.type' <<<"$tag_object")"
              object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
            done
            [[ "$object_type" == commit ]] || {
              echo "tag $TAG resolves to unsupported object type $object_type" >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          # A pre-existing tag is safe only when its final commit is SOURCE_SHA.
          tag_response="$RUNNER_TEMP/release-tag-response"
          tag_absent=false
          if gh api --include "repos/$REPOSITORY/git/ref/tags/$TAG" >"$tag_response"; then
            tag_sha="$(resolve_tag_commit)"
            [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
              echo "tag $TAG already resolves to $tag_sha, not $SOURCE_SHA" >&2
              exit 1
            }
          else
            IFS=' ' read -r _ tag_status _ <"$tag_response" || tag_status=''
            [[ "$tag_status" == 404 ]] || {
              cat "$tag_response" >&2
              exit 1
            }
            tag_absent=true
          fi

          printf 'release_version=%s\n' "${TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'validated %s at %s (pre-existing tag: %s)\n' "$TAG" "$SOURCE_SHA" "$([[ "$tag_absent" == true ]] && echo no || echo yes)"

  build:
    name: build ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
      VERSION: ${{ inputs.tag }}
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install locked browser dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build one canonical release binary
        run: ./scripts/build "build/herdr-web-client-linux-${{ matrix.arch }}"
      - name: Check binary output
        run: test -s "build/herdr-web-client-linux-${{ matrix.arch }}"
      - name: Upload exact binary bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.arch }}
          path: build/herdr-web-client-linux-${{ matrix.arch }}
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 2

  verify:
    name: verify release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Set up Go for license inventory
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download amd64 binary without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-amd64
          path: build/amd64
      - name: Download arm64 binary without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binary-arm64
          path: build/arm64
      - name: Package both Linux architectures and verify them
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          chmod 0755 build/amd64/herdr-web-client-linux-amd64 build/arm64/herdr-web-client-linux-arm64
          ./scripts/package-release "$TAG" \
            build/amd64/herdr-web-client-linux-amd64 \
            build/arm64/herdr-web-client-linux-arm64 \
            release
          release_version="${TAG#v}"
          expected_names=(
            "herdr-web-client_${release_version}_linux_amd64.tar.gz"
            "herdr-web-client_${release_version}_linux_arm64.tar.gz"
            SHA256SUMS
          )
          printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets"
          find release -maxdepth 1 -mindepth 1 -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets"
          cmp "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/actual-assets"
          (cd release && sha256sum --check --strict SHA256SUMS)
          install_root="$RUNNER_TEMP/release-install"
          mkdir -p "$install_root"
          tar -xzf "release/herdr-web-client_${release_version}_linux_amd64.tar.gz" -C "$install_root"
          installed_binary="$install_root/herdr-web-client_${release_version}_linux_amd64/herdr-web-client"
          test -x "$installed_binary"
          [[ "$("$installed_binary" --version)" == "$TAG" ]]
      - name: Upload exact verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 2

  publish:
    name: publish verified draft
    if: ${{ needs.verify.result == 'success' }}
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PRERELEASE: ${{ inputs.prerelease }}
      REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Download the exact verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Create, upload, verify, and publish one exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          expected_amd64="herdr-web-client_${TAG#v}_linux_amd64.tar.gz"
          expected_arm64="herdr-web-client_${TAG#v}_linux_arm64.tar.gz"
          expected_names=("$expected_amd64" "$expected_arm64" SHA256SUMS)
          expected_file="$RUNNER_TEMP/expected-release-assets"
          actual_file="$RUNNER_TEMP/actual-release-assets"
          printf '%s\n' "${expected_names[@]}" | LC_ALL=C sort >"$expected_file"
          find release -maxdepth 1 -mindepth 1 -printf '%f\n' | LC_ALL=C sort >"$actual_file"
          cmp "$expected_file" "$actual_file"
          (cd release && sha256sum --check --strict SHA256SUMS)

          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$SOURCE_SHA" ]] || {
            echo "main moved before publish (expected $SOURCE_SHA, found $main_sha)" >&2
            exit 1
          }

          # Fail closed on API errors: only a real 404 means that no release
          # exists. This prevents accidentally appending to a prior release.
          release_response="$RUNNER_TEMP/existing-release-response"
          if gh api --include "repos/$REPOSITORY/releases/tags/$TAG" >"$release_response"; then
            echo "release $TAG already exists; refusing to modify it" >&2
            exit 1
          else
            IFS=' ' read -r _ release_status _ <"$release_response" || release_status=''
            [[ "$release_status" == 404 ]] || {
              cat "$release_response" >&2
              exit 1
            }
          fi

          resolve_tag_commit() {
            local object_type object_sha tag_object depth=0
            object_type="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
            object_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"
            while [[ "$object_type" == tag ]]; do
              ((depth += 1))
              ((depth <= 8)) || {
                echo "tag $TAG has an excessive annotated-tag chain" >&2
                return 1
              }
              tag_object="$(gh api "repos/$REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -er '.object.type' <<<"$tag_object")"
              object_sha="$(jq -er '.object.sha' <<<"$tag_object")"
            done
            [[ "$object_type" == commit ]] || {
              echo "tag $TAG resolves to unsupported object type $object_type" >&2
              return 1
            }
            printf '%s\n' "$object_sha"
          }

          # A pre-existing tag is allowed only when its final commit is SOURCE_SHA.
          tag_response="$RUNNER_TEMP/existing-tag-response"
          tag_absent=false
          if gh api --include "repos/$REPOSITORY/git/ref/tags/$TAG" >"$tag_response"; then
            tag_sha="$(resolve_tag_commit)"
            [[ "$tag_sha" == "$SOURCE_SHA" ]] || {
              echo "tag $TAG resolves to $tag_sha, not $SOURCE_SHA" >&2
              exit 1
            }
          else
            IFS=' ' read -r _ tag_status _ <"$tag_response" || tag_status=''
            [[ "$tag_status" == 404 ]] || {
              cat "$tag_response" >&2
              exit 1
            }
            tag_absent=true
          fi

          # Re-check immediately before the write: a fast-forward on main while
          # the tag/release probes ran must never become this release's source.
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$SOURCE_SHA" ]] || {
            echo "main moved before release creation (expected $SOURCE_SHA, found $main_sha)" >&2
            exit 1
          }

          release_id=''
          published=false
          tag_created=false
          cleanup() {
            status=$?
            release_cleanup_ok=true
            if [[ -n "$release_id" && "$published" != true ]]; then
              if gh api --method DELETE "repos/$REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
                echo 'draft release removed after an incomplete upload or verification failure' >&2
              else
                release_cleanup_ok=false
                echo 'failed to remove incomplete release; retaining its tag' >&2
              fi
            fi
            if [[ "$tag_created" == true && "$published" != true && "$release_cleanup_ok" == true ]]; then
              current_tag_sha="$(resolve_tag_commit 2>/dev/null || true)"
              if [[ "$current_tag_sha" == "$SOURCE_SHA" ]]; then
                gh api --method DELETE "repos/$REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1 || true
                echo 'workflow-created tag removed after release rollback' >&2
              else
                echo 'workflow-created tag changed unexpectedly; refusing to delete it' >&2
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT

          if [[ "$tag_absent" == true ]]; then
            created_ref="$(gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA")"
            tag_created=true
            [[ "$(jq -er '.object.sha' <<<"$created_ref")" == "$SOURCE_SHA" ]] || {
              echo "GitHub created tag $TAG at the wrong source" >&2
              exit 1
            }
          fi
          [[ "$(resolve_tag_commit)" == "$SOURCE_SHA" ]] || {
            echo "tag $TAG changed before draft creation" >&2
            exit 1
          }

          release_json="$(gh api --method POST "repos/$REPOSITORY/releases" \
            -H 'Accept: application/vnd.github+json' \
            -f "tag_name=$TAG" \
            -f "target_commitish=$SOURCE_SHA" \
            -f "name=$TAG" \
            -f "body=Release $TAG from $SOURCE_SHA (request $REQUEST_ID)." \
            -F draft=true \
            -F "prerelease=$PRERELEASE")"
          release_id="$(jq -er '.id | numbers' <<<"$release_json")"
          [[ "$(jq -er '.draft' <<<"$release_json")" == true ]] || {
            echo 'GitHub did not create a draft release' >&2
            exit 1
          }
          [[ "$(jq -er '.tag_name' <<<"$release_json")" == "$TAG" ]] || {
            echo 'GitHub returned the wrong release tag' >&2
            exit 1
          }
          [[ "$(jq -er '.target_commitish' <<<"$release_json")" == "$SOURCE_SHA" ]] || {
            echo 'GitHub returned the wrong release source' >&2
            exit 1
          }
          [[ "$(resolve_tag_commit)" == "$SOURCE_SHA" ]] || {
            echo "tag $TAG does not resolve to the release source after draft creation" >&2
            exit 1
          }

          # Deliberately omit overwrite flags. Any duplicate asset is a hard
          # failure; cleanup above removes the draft so no partial asset set remains.
          gh release upload "$TAG" --repo "$REPOSITORY" \
            "release/$expected_amd64" "release/$expected_arm64" release/SHA256SUMS

          verify_release_assets() {
            local release_json=$1
            local expected_draft=$2
            [[ "$(jq -er '.draft' <<<"$release_json")" == "$expected_draft" ]] || return 1
            [[ "$(jq -er '.tag_name' <<<"$release_json")" == "$TAG" ]] || return 1
            [[ "$(jq -er '.target_commitish' <<<"$release_json")" == "$SOURCE_SHA" ]] || return 1
            jq -r '.assets[].name' <<<"$release_json" | LC_ALL=C sort >"$RUNNER_TEMP/remote-assets"
            cmp "$expected_file" "$RUNNER_TEMP/remote-assets"
            while read -r digest filename; do
              [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
              remote_digest="$(jq -er --arg name "$filename" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
              [[ "$remote_digest" == "sha256:$digest" ]] || return 1
              local_size="$(stat -c '%s' "release/$filename")"
              remote_size="$(jq -er --arg name "$filename" '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
              [[ "$remote_size" == "$local_size" ]] || return 1
            done < release/SHA256SUMS
            checksum_digest="$(sha256sum release/SHA256SUMS | cut -d' ' -f1)"
            remote_checksum_digest="$(jq -er --arg name SHA256SUMS '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            [[ "$remote_checksum_digest" == "sha256:$checksum_digest" ]] || return 1
            checksum_size="$(stat -c '%s' release/SHA256SUMS)"
            remote_checksum_size="$(jq -er --arg name SHA256SUMS '.assets[] | select(.name == $name) | .size' <<<"$release_json")"
            [[ "$remote_checksum_size" == "$checksum_size" ]] || return 1
          }

          draft_json="$(gh api "repos/$REPOSITORY/releases/$release_id")"
          verify_release_assets "$draft_json" true
          main_sha="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$SOURCE_SHA" ]] || {
            echo "main moved while assets were uploaded (expected $SOURCE_SHA, found $main_sha)" >&2
            exit 1
          }


          [[ "$(resolve_tag_commit)" == "$SOURCE_SHA" ]] || {
            echo "tag $TAG changed while assets were uploaded" >&2
            exit 1
          }

          published_json="$(gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false)"
          [[ "$(jq -er '.draft' <<<"$published_json")" == false ]] || {
            echo 'GitHub did not publish the verified draft' >&2
            exit 1
          }
          published=true
          final_json="$(gh api "repos/$REPOSITORY/releases/$release_id")"
          verify_release_assets "$final_json" false
          [[ "$(resolve_tag_commit)" == "$SOURCE_SHA" ]] || {
            echo "published tag $TAG no longer resolves to the release source" >&2
            exit 1
          }
          trap - EXIT
          printf 'published %s at %s with exact verified assets\n' "$TAG" "$SOURCE_SHA"
