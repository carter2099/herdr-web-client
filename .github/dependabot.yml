version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: UTC
    open-pull-requests-limit: 10
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: UTC
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: UTC
    open-pull-requests-limit: 10
